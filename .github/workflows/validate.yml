name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build bundles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint source and tests
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build production and development bundles
        run: npm run build:dev
      - name: Check production bundle size
        run: npm run check:bundle-size
      - name: Verify committed bundles are current
        run: git diff --exit-code -- dist/orbit-cards.js dist/orbit-cards-dev.js

  validate-hacs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
